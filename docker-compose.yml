version: '3.8'

services:
  # ==========================================
  # Application Service
  # ==========================================
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      # Hot reload support
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_POSTHOG_KEY=${VITE_POSTHOG_KEY:-phc_development_key}
      - VITE_POSTHOG_HOST=http://localhost:8001
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LOKI_ENDPOINT=http://loki:3100/loki/api/v1/push
      - OTLP_ENDPOINT=http://tempo:4318/v1/traces
    depends_on:
      - loki
      - tempo
      - postgres
      - posthog
    networks:
      - monitoring
      - app-network

  # ==========================================
  # Grafana Stack
  # ==========================================

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring
    depends_on:
      - loki
      - tempo
      - prometheus

  # Loki - Log aggregation
  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - monitoring

  # Tempo - Distributed tracing
  tempo:
    image: grafana/tempo:2.7.1
    ports:
      - "3200:3200"   # Tempo
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - tempo-data:/tmp/tempo
      - ./docker/tempo/tempo-config.yaml:/etc/tempo.yaml
    networks:
      - monitoring

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - prometheus-data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  # ==========================================
  # Sentry Self-Hosted
  # ==========================================

  # PostgreSQL for Sentry
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry
      POSTGRES_DB: sentry
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Sentry
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sentry Web
  sentry-web:
    image: getsentry/sentry:24.12.1
    ports:
      - "9000:9000"
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-'!!changeme!!'}
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: redis
      SENTRY_SINGLE_ORGANIZATION: 'true'
    volumes:
      - sentry-data:/var/lib/sentry/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    command: run web

  # Sentry Cron
  sentry-cron:
    image: getsentry/sentry:24.12.1
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-'!!changeme!!'}
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: redis
    volumes:
      - sentry-data:/var/lib/sentry/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    command: run cron

  # Sentry Worker
  sentry-worker:
    image: getsentry/sentry:24.12.1
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-'!!changeme!!'}
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: redis
    volumes:
      - sentry-data:/var/lib/sentry/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    command: run worker

  # ==========================================
  # PostHog Self-Hosted
  # ==========================================

  # PostHog ClickHouse database
  posthog-clickhouse:
    image: clickhouse/clickhouse-server:24.11.2.42
    volumes:
      - posthog-clickhouse-data:/var/lib/clickhouse
      - ./docker/posthog/clickhouse-config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./docker/posthog/clickhouse-users.xml:/etc/clickhouse-server/users.d/users.xml
    environment:
      CLICKHOUSE_DB: posthog
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostHog PostgreSQL
  posthog-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: posthog
      POSTGRES_DB: posthog
    volumes:
      - posthog-postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostHog Redis
  posthog-redis:
    image: redis:7-alpine
    volumes:
      - posthog-redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostHog Kafka/Zookeeper (for events)
  posthog-zookeeper:
    image: zookeeper:3.9
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - posthog-zookeeper-data:/data
      - posthog-zookeeper-logs:/datalog
    networks:
      - app-network

  posthog-kafka:
    image: bitnami/kafka:3.9
    depends_on:
      - posthog-zookeeper
    environment:
      KAFKA_BROKER_ID: 1001
      KAFKA_CFG_RESERVED_BROKER_MAX_ID: 1001
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://posthog-kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: posthog-zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    volumes:
      - posthog-kafka-data:/bitnami/kafka
    networks:
      - app-network

  # PostHog Main Application
  posthog:
    image: posthog/posthog:latest
    ports:
      - "8001:8000"
      - "8002:8001"
    environment:
      DATABASE_URL: postgres://posthog:posthog@posthog-postgres:5432/posthog
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      REDIS_URL: redis://posthog-redis:6379/
      KAFKA_HOSTS: posthog-kafka:9092
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-'changeme-secret-key-min-32-chars!!'}
      SITE_URL: http://localhost:8001
      DISABLE_SECURE_SSL_REDIRECT: 'true'
      IS_BEHIND_PROXY: 'true'
      TRUST_ALL_PROXIES: 'true'
    depends_on:
      posthog-postgres:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-kafka:
        condition: service_started
    volumes:
      - posthog-data:/data
    networks:
      - app-network
      - monitoring

  # PostHog Worker
  posthog-worker:
    image: posthog/posthog:latest
    command: ./bin/docker-worker-celery --with-scheduler
    environment:
      DATABASE_URL: postgres://posthog:posthog@posthog-postgres:5432/posthog
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      REDIS_URL: redis://posthog-redis:6379/
      KAFKA_HOSTS: posthog-kafka:9092
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-'changeme-secret-key-min-32-chars!!'}
      SITE_URL: http://localhost:8001
    depends_on:
      posthog-postgres:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-kafka:
        condition: service_started
    networks:
      - app-network

networks:
  monitoring:
    driver: bridge
  app-network:
    driver: bridge

volumes:
  # Grafana Stack
  grafana-data:
  loki-data:
  tempo-data:
  prometheus-data:

  # Sentry
  postgres-data:
  redis-data:
  sentry-data:

  # PostHog
  posthog-postgres-data:
  posthog-clickhouse-data:
  posthog-redis-data:
  posthog-zookeeper-data:
  posthog-zookeeper-logs:
  posthog-kafka-data:
  posthog-data:

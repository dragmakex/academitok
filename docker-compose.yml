services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set (e.g. academitok.example.com)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academitok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-academitok}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-academitok} -d ${POSTGRES_DB:-academitok}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only — public traffic enters through Caddy with automatic HTTPS
      - "127.0.0.1:${APP_BIND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-academitok}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-academitok}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:?OPENALEX_MAILTO must be set}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      LOKI_OTLP_ENDPOINT: ${LOKI_OTLP_ENDPOINT:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      SERVICE_NAME: ${SERVICE_NAME:-academitok}
    networks:
      - internal

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-academitok}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-academitok}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
    volumes:
      - ${HOST_BACKUP_DIR:-./backups}:/backups
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
      - ./scripts/db-restore.sh:/usr/local/bin/db-restore.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          sh /usr/local/bin/db-backup.sh
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  internal:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academitok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-academitok}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-academitok} -d ${POSTGRES_DB:-academitok}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-academitok}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-academitok}
      AUTH_ORIGINS: ${AUTH_ORIGINS:?AUTH_ORIGINS must be set}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:?OPENALEX_MAILTO must be set}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      LOKI_OTLP_ENDPOINT: ${LOKI_OTLP_ENDPOINT:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      SERVICE_NAME: ${SERVICE_NAME:-academitok}

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-academitok}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-academitok}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
    volumes:
      - postgres_backups:/backups
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          sh /usr/local/bin/db-backup.sh
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  postgres_data:
  postgres_backups:
